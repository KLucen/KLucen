<svg xmlns="http://www.w3.org/2000/svg" width="420" height="390" viewBox="0 0 420 390" role="img" aria-labelledby="overview-dark-mobile-title overview-dark-mobile-desc"><title id="overview-dark-mobile-title">GitHub 数据概览：把想法写进代码里</title><desc id="overview-dark-mobile-desc">KLucen 的公开数据。Commit 贡献 328，公开仓库 17，Stars 4，代码语言 13。自有公开非 fork 仓库，含归档；日期范围 2025-10-31 → 2026-10-30 UTC。数据状态 PUBLIC DATA；更新 2026-10-30 07:08 UTC。</desc><rect x="0.5" y="0.5" width="419" height="389" rx="8" fill="#11171c" stroke="#33414d"/><g font-family="Segoe UI, Noto Sans SC, Microsoft YaHei, Arial, sans-serif"><text x="28" y="29" font-size="11" fill="#70dbb3" font-weight="700">01 / GITHUB</text><text x="28" y="63" font-size="24" fill="#edf3f7" font-weight="700">把想法写进代码里</text><text x="392" y="29" font-size="10" fill="#a3b1bd" font-weight="600" text-anchor="end">PUBLIC DATA</text><path d="M210 91V305 M28 198H392" fill="none" stroke="#33414d"/><text x="28" y="127" font-size="34" fill="#70dbb3" font-weight="700">328</text><text x="28" y="153" font-size="14" fill="#edf3f7" font-weight="600">Commit 贡献</text><text x="28" y="173" font-size="11" fill="#a3b1bd">过去 365 个 UTC 日期</text><text x="236" y="127" font-size="34" fill="#edf3f7" font-weight="700">17</text><text x="236" y="153" font-size="14" fill="#edf3f7" font-weight="600">公开仓库</text><text x="236" y="173" font-size="11" fill="#a3b1bd">自有仓库 · 排除 fork</text><text x="28" y="237" font-size="34" fill="#edf3f7" font-weight="700">4</text><text x="28" y="263" font-size="14" fill="#edf3f7" font-weight="600">Stars</text><text x="28" y="283" font-size="11" fill="#a3b1bd">公开非 fork 仓库合计</text><text x="236" y="237" font-size="34" fill="#edf3f7" font-weight="700">13</text><text x="236" y="263" font-size="14" fill="#edf3f7" font-weight="600">代码语言</text><text x="236" y="283" font-size="11" fill="#a3b1bd">GitHub Linguist</text><path d="M28 322H392" fill="none" stroke="#33414d"/><text x="28" y="345" font-size="11" fill="#a3b1bd">UTC 范围 2025-10-31 → 2026-10-30</text><te