<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-labelledby="sync-dark-mobile-title sync-dark-mobile-desc"><title id="sync-dark-mobile-title">每日自动更新计划</title><desc id="sync-dark-mobile-desc">GitHub Actions 每日北京时间 09:17 更新公开数据。最近采集 2026-10-22 14:07 北京时间。状态点表示更新计划，不表示在线状态；动效仅播放两轮，减少动效模式显示静态。</desc><style>.sync-dot{opacity:1}</style><rect x=".5" y=".5" width="419" height="63" rx="8" fill="#11171c" stroke="#33414d"/><g font-family="Segoe UI, Noto Sans SC, Microsoft YaHei, Arial, sans-serif"><circle class="sync-dot" cx="25" cy="23" r="4" fill="#70dbb3"/><text x="40" y="28" font-size="13" fill="#edf3f7" font-weight="600">每日自动更新</text><text x="178" y="28" font-size="12" fill="#a3b1bd" >09:17 北京时间</text><text x="40" y="50" font-size="11" fill="#a3b1bd" >最近采集 2026-10-22 14:07</text></g></svg>
