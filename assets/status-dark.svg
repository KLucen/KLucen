<svg xmlns="http://www.w3.org/2000/svg" width="900" height="44" viewBox="0 0 900 44" role="img" aria-labelledby="sync-dark-desktop-title sync-dark-desktop-desc"><title id="sync-dark-desktop-title">每日自动更新计划</title><desc id="sync-dark-desktop-desc">GitHub Actions 每日北京时间 09:17 更新公开数据。最近采集 2026-10-20 14:01 北京时间。状态点表示更新计划，不表示在线状态；动效仅播放两轮，减少动效模式显示静态。</desc><style>.sync-dot{opacity:1;animation:sync-breathe 4s cubic-bezier(0.77,0,0.175,1) 2 forwards}@keyframes sync-breathe{0%,100%{opacity:1}50%{opacity:.35}}@media(prefers-reduced-motion:reduce){.sync-dot{animation:none}}</style><rect x=".5" y=".5" width="899" height="43" rx="8" fill="#11171c" stroke="#33414d"/><g font-family="Segoe UI, Noto Sans SC, Microsoft YaHei, Arial, sans-serif"><circle class="sync-dot" cx="25" cy="22" r="4" fill="#70dbb3"/><text x="40" y="27" font-size="13" fill="#edf3f7" font-weight="600">每日自动更新</text><text x="148" y="27" font-size="12" fill="#a3b1bd" >09:17 北京时间</text><text x="872" y="27" font-size="11" fill="#a3b1bd" text-anchor="end">最近采集 2026-10-20 14:01 北京时间</text></g></svg>
