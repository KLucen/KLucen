<svg xmlns="http://www.w3.org/2000/svg" width="900" height="228" viewBox="0 0 900 228" role="img" aria-labelledby="overview-light-desktop-title overview-light-desktop-desc"><title id="overview-light-desktop-title">GitHub 数据概览：把想法写进代码里</title><desc id="overview-light-desktop-desc">KLucen 的公开数据。Commit 贡献 265，公开仓库 14，Stars 2，代码语言 9。自有公开非 fork 仓库，含归档；日期范围 2025-10-17 → 2026-10-16 UTC。数据状态 PUBLIC DATA；更新 2026-10-16 05:52 UTC。</desc><rect x="0.5" y="0.5" width="899" height="227" rx="8" fill="#ffffff" stroke="#dce4e9"/><g font-family="Segoe UI, Noto Sans SC, Microsoft YaHei, Arial, sans-serif"><text x="28" y="29" font-size="11" fill="#188360" font-weight="700">01 / GITHUB</text><text x="28" y="66" font-size="27" fill="#202b34" font-weight="700">把想法写进代码里</text><text x="872" y="29" font-size="10" fill="#61717e" font-weight="600" text-anchor="end">PUBLIC DATA</text><path d="M239 94V177 M450 94V177 M661 94V177" fill="none" stroke="#dce4e9"/><text x="28" y="130" font-size="37" fill="#188360" font-weight="700">265</text><text x="28" y="156" font-size="14" fill="#202b34" font-weight="600">Commit 贡献</text><text x="28" y="176" font-size="11" fill="#61717e">过去 365 个 UTC 日期</text><text x="239" y="130" font-size="37" fill="#202b34" font-weight="700">14</text><text x="239" y="156" font-size="14" fill="#202b34" font-weight="600">公开仓库</text><text x="239" y="176" font-size="11" fill="#61717e">自有仓库 · 排除 fork</text><text x="450" y="130" font-size="37" fill="#202b34" font-weight="700">2</text><text x="450" y="156" font-size="14" fill="#202b34" font-weight="600">Stars</text><text x="450" y="176" font-size="11" fill="#61717e">公开非 fork 仓库合计</text><text x="661" y="130" font-size="37" fill="#202b34" font-weight="700">9</text><text x="661" y="156" font-size="14" fill="#202b34" font-weight="600">代码语言</text><text x="661" y="176" font-size="11" fill="#61717e">GitHub Linguist</text><path d="M28 187H872" fill="none" stroke="#dce4e9"/><text x="28" y="211" font-size="11" fill="#61717e">UTC 范围 2025-10-17 →